[package]
name = "order_and_inventory_task"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "rt-multi-thread"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "macros", "migrate"] }
serde = { version = "1", features = ["derive"] }
axum = { version = "0.8.9", features = ["macros"] }
dotenvy = "0.15.0"
jsonwebtoken = "9"
chrono = "0.4"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"]}